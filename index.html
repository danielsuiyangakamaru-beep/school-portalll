<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Northstar Academy school management dashboard">
  <title>Northstar Academy · School Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="school.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="Northstar Academy home">
        <span class="brand-mark">N</span>
        <span><strong>northstar</strong><small>ACADEMY</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button class="nav-item" data-page="students"><span class="nav-icon">♙</span>Students <span class="nav-count" id="student-nav-count"></span></button>
        <button class="nav-item" data-page="teachers"><span class="nav-icon">♧</span>Teachers</button>
        <button class="nav-item" data-page="classes"><span class="nav-icon">▦</span>Classes & subjects</button>
        <button class="nav-item" data-page="attendance"><span class="nav-icon">✓</span>Attendance</button>
        <button class="nav-item" data-page="exams"><span class="nav-icon">▤</span>Examinations</button>
        <button class="nav-item" data-page="fees"><span class="nav-icon">＄</span>Fees & payments</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Performance reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="support-card">
          <div class="support-icon">✦</div>
          <strong>Need a hand?</strong>
          <p>Your school, all in one place. Your data stays on this device.</p>
        </div>
        <div class="profile">
          <div class="avatar avatar-indigo">AS</div>
          <span><strong>Alexandra Smith</strong><small>School administrator</small></span>
          <span class="profile-more">···</span>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>Northstar Academy</span><span class="crumb-divider">/</span><strong id="current-section">Overview</strong></div>
        <div class="topbar-actions">
          <label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Search students, teachers..." aria-label="Search current page"><kbd>⌘ K</kbd></label>
          <button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button>
          <div class="avatar avatar-indigo top-avatar">AS</div>
        </div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
</body>
</html>
